{% extends "base.html" %}
{% block title %}Page Not Found — MaizeIQ{% endblock %}
{% block content %}
<div class="error-page">
  <div class="error-code">404</div>
  <div class="error-msg">Page Not Found</div>
  <p class="error-sub">The page you're looking for doesn't exist or has been moved.</p>
  <div style="display:flex;gap:1rem;flex-wrap:wrap;justify-content:center;">
    <a href="{{ url_for('home') }}" class="btn-primary">🏠 Go Home</a>
    <a href="{{ url_for('prediction') }}" class="btn-outline" style="color:var(--green-700);border-color:var(--green-700);">🌽 Make a Prediction</a>
  </div>
</div>
{% endblock %}
